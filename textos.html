<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Textos autorais de Daniel Sievert.">
  <title>Texto | Daniel Sievert</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark light;
      --nord0: #2e3440;
      --nord1: #3b4252;
      --nord2: #434c5e;
      --nord3: #4c566a;
      --nord4: #d8dee9;
      --nord5: #e5e9f0;
      --nord8: #88c0d0;
      --surface-bg: rgba(46, 52, 64, 0.96);
      --surface-border: var(--nord2);
      --surface-shadow: rgba(0, 0, 0, 0.15);
      --text-primary: var(--nord4);
      --text-heading: var(--nord5);
      --text-muted: var(--nord3);
      --link-color: #81a1c1;
      --nav-hover-bg: var(--nord2);
      --divider-color: var(--nord3);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --nord0: #f3f3f3;
        --nord2: #e5e5e5;
        --nord3: #cfcfcf;
        --nord4: #1f1f1f;
        --nord5: #262626;
        --nord8: #005999;
        --surface-bg: rgba(255, 255, 255, 0.96);
        --surface-border: #d4d4d4;
        --surface-shadow: rgba(15, 23, 42, 0.08);
        --text-primary: #1f1f1f;
        --text-heading: #262626;
        --text-muted: #616161;
        --link-color: #1f4e79;
        --nav-hover-bg: #e5e5e5;
        --divider-color: #d4d4d4;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--nord0);
      color: var(--text-primary);
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .site-wrapper {
      max-width: 690px;
      margin: 0 auto;
      padding: 120px 20px 80px;
      text-align: center;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      padding: 16px 20px;
      background-color: var(--surface-bg);
      border-bottom: 1px solid var(--surface-border);
      box-shadow: 0 8px 20px var(--surface-shadow);
    }

    .header-content {
      max-width: 650px;
      margin: 0 auto;
    }

    .contact-link {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--nord8);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .anchor-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .anchor-nav a {
      padding: 6px 10px;
      border-radius: 0;
      color: var(--link-color);
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .anchor-nav a:hover,
    .anchor-nav a:focus-visible {
      background-color: var(--nav-hover-bg);
      color: var(--text-heading);
    }

    .anchor-nav a:focus-visible,
    .contact-link:focus-visible {
      outline: 2px solid var(--link-color);
      outline-offset: 3px;
    }

    main {
      min-height: 300px;
      padding-top: 22px;
    }

    h1 {
      margin-bottom: 12px;
      color: var(--text-heading);
      font-family: 'Fira Sans', sans-serif;
      font-size: 1.7rem;
      font-weight: 600;
    }

    .intro {
      max-width: 52ch;
      margin: 0 auto;
    }

    .empty-state {
      margin: 42px auto 0;
      padding: 28px 16px;
      border-top: 1px solid var(--divider-color);
      border-bottom: 1px solid var(--divider-color);
      color: var(--text-primary);
    }

    footer {
      margin-top: 80px;
      padding-top: 30px;
      border-top: 1px solid var(--nord2);
    }

    .copyright {
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    @media (max-width: 520px) {
      .site-wrapper {
        padding-top: 128px;
      }

      .anchor-nav {
        gap: 2px;
      }

      .anchor-nav a {
        padding: 6px 7px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <header>
      <div class="header-content">
        <a class="contact-link" href="https://wa.me/5500000000000?text=Ol%C3%A1%20Daniel,%20vi%20seu%20portf%C3%B3lio%20e%20gostaria%20de%20conversar!" target="_blank" rel="noopener noreferrer">Falar pelo WhatsApp</a>
        <nav class="anchor-nav" aria-label="Navegação principal">
          <a href="index.html#bio">Início</a>
          <a href="index.html#client-videos">Vídeo</a>
          <a href="index.html#ads-photo">Fotografia</a>
          <a href="textos.html" aria-current="page">Texto</a>
        </nav>
      </div>
    </header>

    <main>
      <h1>Texto</h1>
      <p class="intro">Uma seleção de textos escritos por Daniel Sievert.</p>
      <p class="empty-state">Os títulos e textos serão publicados aqui em breve.</p>
    </main>

    <footer>
      <p class="copyright">&copy; Daniel Sievert — Criação Audiovisual. Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>
